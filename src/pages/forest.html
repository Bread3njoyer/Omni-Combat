<!DOCTYPE html>

<html>
  <head>
    <!-- Most of this was pulled from the "html-5 boilerplate" extension -->
    <meta charset="utf-8">
    <link rel="icon" href="../Omnitech_favicon.ico" />
    <title>Tokens & Tarrasques - Forest</title>
    <meta name="description" content="">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="../styles/forestStyles.css">
    <link rel="stylesheet" href="../styles/tokenStyles.css">
  </head>
  <body>
    <div class="info-container">
      <div class="player-info">
          <h1>Player Info</h1>
            <!-- Not sure what I this should be yet.-->
      </div> 
      <div class="game-container">
        <h1>Tokens & Tarrasques - Forest</h1>
        <div class="game-window">
          <div class="grid-container"> 
            <!-- This is where the grid will be generated -->
          </div>
          
          <div class="controls">
            <button id="moveBtn">Move</button>
            <button id="attackBtn">Attack</button>
            <button id="endTurnBtn">End Turn</button>
            <p id="info-text" class="hidden"></p>
            <button id="backBtn" class ="hidden">Back</button>
          </div>
        </div>
      </div>
      <div class="combat-log">
        <h1 class="active">Combat Log</h1>
      </div> 
    </div>

    <div id="popup-modal-win" class="modal">
      <div class="modal-content">
        <h1 id="win-text">You won!</h1>
        <button class="restartBtn">Restart</button>
        <button class="returnBtn">Return Home</button>
      </div>
    </div>
    <div id="popup-modal-loss" class="modal">
      <div class="modal-content">
        <h1 id="loss-text">You lose :(</h1>
        <button class="restartBtn">Restart</button>
        <button class="returnBtn">Return Home</button>
      </div>
    </div>
    <footer>
      <p>Map by 2-Minute Tabletop </p>
    </footer>
    <script type="module" src="../scripts/gridScripts.js" defer></script>
  </body>
</html>
